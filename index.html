<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Schedule Finder</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=Patua+One&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Skip link for keyboard users -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- =========================
       PAGE HEADER
       Edit the text here if you want to change titles or labels
       ========================= -->
  <header>
    <div class="page-shell">
      <div class="brand-row">
        <div class="brand-badge" aria-hidden="true">UTRGV</div>
        <div>
          <h1>Tutor Schedule Finder</h1>
          <p class="subtitle">Learning Center Tutoring Schedules · Search by course or by day</p>
        </div>
      </div>

      <div class="search-row" role="search" aria-label="Tutor search tools">
        <!-- SEARCH BOX 1: COURSE / SUBJECT -->
        <div class="search-group">
          <label for="course-search-input">Search by Subject or Course Code</label>
          <input
            id="course-search-input"
            type="search"
            placeholder="Example: CSCI 1101, Calculus, Biology"
            autocomplete="off"
            aria-describedby="course-help"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="course-suggestions"
          >
          <p id="course-help" class="help-text">
            Start typing a course code or course name.
          </p>
          <div
            id="course-suggestions"
            class="suggestions"
            role="listbox"
            aria-label="Course suggestions"
          ></div>
        </div>

        <!-- SEARCH BOX 2: DAY -->
        <div class="search-group">
          <label for="day-search-input">Search by Day</label>
          <input
            id="day-search-input"
            type="search"
            placeholder="Example: Monday, Tuesday, Wednesday"
            autocomplete="off"
            aria-describedby="day-help"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="day-suggestions"
          >
          <p id="day-help" class="help-text">
            Type a weekday to see tutors available that day.
          </p>
          <div
            id="day-suggestions"
            class="suggestions"
            role="listbox"
            aria-label="Day suggestions"
          ></div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================
       MAIN RESULTS AREA
       The JavaScript fills this area automatically
       ========================= -->
  <main id="main-content" class="page-shell" tabindex="-1">
    <section id="empty-state" class="empty-state" aria-live="polite">
      <h2>Find a Tutor or Day</h2>
      <p>Use the search boxes above to browse the schedule.</p>
    </section>

    <section id="results-area" aria-live="polite" aria-atomic="false"></section>

  </main>

  <!-- Data file first -->
  <script src="data.js"></script>

  <!-- Main page behavior -->
  <script src="script.js"></script>
</body>
</html>
